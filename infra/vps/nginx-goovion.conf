server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name govion.com.tr www.govion.com.tr 91.108.120.203;

    root /var/www/goovion/public;
    index index.php;
    client_max_body_size 20M;

    # Adisyon — QR static regex'inden once (^~ oncelikli)
    include /etc/nginx/snippets/adisyon.conf;

    # QR menu static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # QR menu (PHP) — root /
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\. {
        deny all;
    }
}
