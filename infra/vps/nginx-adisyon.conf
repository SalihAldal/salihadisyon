# Adisyon SaaS — /adisyon alt path (QR menu / goovion root'a dokunmaz)
# include /etc/nginx/snippets/adisyon.conf;  -> goovion server block icine ekleyin

# Eski/yanlis istemci URL'leri icin guvenlik agi (/api/v1 -> backend)
location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:4100/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location ^~ /adisyon/api/ {
    proxy_pass http://127.0.0.1:4100/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location ^~ /adisyon/ws/ {
    proxy_pass http://127.0.0.1:4100/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /adisyon/admin {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location ^~ /adisyon/pos/ {
    alias /var/www/adisyon/apps/pos-web/dist/;
    index index.html;
    try_files $uri $uri/ index.html;
}

location = /adisyon/pos {
    return 301 /adisyon/pos/;
}
